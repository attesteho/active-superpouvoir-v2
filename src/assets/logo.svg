<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" role="img" aria-label="Active ton Superpouvoir — La Fabrique des Héros">
  <title>Active ton Superpouvoir — La Fabrique des Héros</title>
  <defs>
    <!-- Star gradient for icon mark (center at ~38%,32% of the 64x64 mark) -->
    <radialGradient id="logo-g" cx="38%" cy="32%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="55%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FFB000"/>
    </radialGradient>
    <!-- Clip bolt to icon-mark star (coords offset by 4,4 from SVG origin) -->
    <clipPath id="logo-sc">
      <polygon points="36,8.5 42.4,27.2 62.2,27.5 46.4,39.4 52.2,58.3 36,46.9 19.8,58.3 25.6,39.4 9.8,27.5 29.6,27.2"/>
    </clipPath>
  </defs>

  <!-- ── Icon mark (64×64 at position 4,4) ── -->
  <!-- Dark rounded background -->
  <rect x="4" y="4" width="64" height="64" rx="14" fill="#321044"/>

  <!-- Subtle gold border -->
  <rect x="4" y="4" width="64" height="64" rx="14" fill="none" stroke="#FFB000" stroke-width="1" stroke-opacity="0.25"/>

  <!-- 5-pointed gold star (scaled & centered at 36,36) -->
  <polygon
    points="36,8.5 42.4,27.2 62.2,27.5 46.4,39.4 52.2,58.3 36,46.9 19.8,58.3 25.6,39.4 9.8,27.5 29.6,27.2"
    fill="url(#logo-g)"
  />

  <!-- Lightning bolt — dark Z-shape, clipped to star -->
  <path
    d="M 40.5,16.8 L 27,38.6 L 34.1,38.6 L 31.5,56.5 L 44.3,34.1 L 37.3,34.1 Z"
    fill="#321044"
    clip-path="url(#logo-sc)"
  />

  <!-- Shine highlight -->
  <ellipse cx="28" cy="20" rx="5" ry="3.5" fill="white" opacity="0.15" clip-path="url(#logo-sc)"/>

  <!-- ── Separator ── -->
  <line x1="80" y1="13" x2="80" y2="59" stroke="#FFB000" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- ── Text block (starts at x=88) ── -->

  <!-- "ACTIVE TON" — small, spaced, muted white -->
  <text
    x="88" y="30"
    font-family="Nunito, 'Nunito Sans', Arial, sans-serif"
    font-size="9"
    font-weight="800"
    fill="rgba(255,255,255,0.48)"
    letter-spacing="3.5"
  >ACTIVE TON</text>

  <!-- "SUPERPOUVOIR" — large, gold, Playfair Display -->
  <text
    x="86" y="49"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="19.5"
    font-weight="900"
    fill="#FFB000"
    letter-spacing="-0.4"
  >SUPERPOUVOIR</text>

  <!-- "LA FABRIQUE DES HÉROS" — tiny tagline -->
  <text
    x="88" y="61"
    font-family="Nunito, 'Nunito Sans', Arial, sans-serif"
    font-size="7"
    font-weight="700"
    fill="rgba(255,255,255,0.28)"
    letter-spacing="2"
  >LA FABRIQUE DES HÉROS</text>
</svg>

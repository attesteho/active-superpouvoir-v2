<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Active ton Superpouvoir">
  <title>Active ton Superpouvoir</title>
  <defs>
    <!-- Gold radial gradient: warm highlight from upper-left -->
    <radialGradient id="icon-g" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="55%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FFB000"/>
    </radialGradient>
    <!-- Clip bolt to star shape -->
    <clipPath id="icon-sc">
      <polygon points="50,7 60,36.3 90.9,36.7 66.2,55.3 75.3,84.8 50,67 24.7,84.8 33.8,55.3 9.1,36.7 40,36.3"/>
    </clipPath>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="100" height="100" rx="22" fill="#321044"/>

  <!-- 5-pointed gold star -->
  <polygon
    points="50,7 60,36.3 90.9,36.7 66.2,55.3 75.3,84.8 50,67 24.7,84.8 33.8,55.3 9.1,36.7 40,36.3"
    fill="url(#icon-g)"
  />

  <!-- Lightning bolt — dark, Z-shape, clipped to star -->
  <path
    d="M 57,20 L 36,54 L 47,54 L 43,82 L 63,47 L 52,47 Z"
    fill="#321044"
    clip-path="url(#icon-sc)"
  />

  <!-- Subtle shine highlight (upper-left of star) -->
  <ellipse cx="36" cy="25" rx="7" ry="5" fill="white" opacity="0.18" clip-path="url(#icon-sc)"/>
</svg>
